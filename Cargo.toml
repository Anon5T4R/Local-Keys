[workspace]
resolver = "3"
members = ["xtask", "crates/core"]
default-members = ["."]
exclude = ["libs"]

[workspace.package]
# Nada da suíte vai ao crates.io: dependência `path` sem versão numa crate publicável reprova o
# `cargo-deny` (wildcards). Cada membro herda com `publish.workspace = true`.
publish = false

# Forks vendored (egui 6d518fc, winit a517b38) — receita no AGENTS.md do local-office.
[patch.crates-io]
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
# // local-keys: fork do rustls-rustcrypto (experimento TLS puro do updater).
# O upstream 0.0.2-alpha puxa rustls-webpki 0.102 só pelas constantes `alg_id`;
# o fork usa `rustls-pki-types` e some com os advisories (README no próprio fork).
rustls-rustcrypto = { path = "libs/rustls-rustcrypto" }

[package]
name = "local-keys"
version = "0.13.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish.workspace = true
repository = "https://github.com/Anon5T4R/Local-Keys"
description = "Gerenciador de senhas 100% local e offline da suíte Local"

[build-dependencies]
# Embute o ícone no .exe (Windows) — sem isso o Explorer mostra ícone genérico.
winresource = "0.1"

[dependencies]
# O núcleo sem UI (formato, cofre, importadores, TOTP, gerador): crates/core.
localkeys-core = { path = "crates/core" }
eframe = "0.37"
# 0.37: os emojis monocromáticos (★ ☆ 📎 👁 ⚠ ✓…) saíram do padrão; sem eles a tela mostra caixinhas.
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
image = "0.25"
craft-i18n = { path = "libs/craft-libs/crates/i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cripto — MESMOS pins do LocalKeys oficial (crypto.rs/totp.rs copiados verbatim)
zeroize = { version = "1", features = ["derive"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }
# Base64 em TODAS as plataformas: anexos (vault.rs) e o import do export
# cifrado do Bitwarden (bwdecrypt.rs) usam — o desbloqueio rápido no keyring
# também, e continua funcionando.
base64 = "0.22"
# Import de cofres KeePass (.kdbx) — lê/decifra com a senha do usuário.
# Gerador de senha/passphrase + medidor de força (zxcvbn).
# Import do export CIFRADO do Bitwarden (PBKDF2/Argon2id → HKDF → AES-CBC+HMAC).
# Atualização: craft_update (libs/craft-libs) — check no GitHub, prompt egui e
# self-update (Windows: MSI/portable; Linux: AppImage/tar.gz). O `egui` liga o
# prompt e o Updater de UI.
craft-update = { path = "libs/craft-libs/crates/update", features = ["egui", "icons"] }
# Linux: a escolha clara/escura do desktop chega ao `ctx.system_theme()` (o winit não informa lá);
# fonte no local-libs, espelhada aqui pelo sync.ps1.
craft-desktop-theme = { path = "libs/craft-libs/crates/desktop-theme" }
# Os ícones dos conceitos comuns da suíte (tema, configurações, busca…) e o botão de tema; fonte: local-libs.
craft-icons = { path = "libs/craft-libs/crates/icons", features = ["egui"] }
# A paleta de comandos da suíte (lupa e Ctrl+K); fonte: local-libs.
craft-palette = { path = "libs/craft-libs/crates/palette" }
# Carregador de SVG dos ícones da suíte (resvg, Rust puro); fork vendored via [patch].
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# Seletor NATIVO de arquivo/pasta. Defaults do rfd 0.17 no Linux = backend
# XDG portal (Rust puro via zbus, fallback Zenity) — mesmo padrão dos apps
# maduros (local-pdf e irmãos); chamadas via AsyncFileDialog + thread worker
# (src/pickers.rs, molde do local-pdf). Windows segue o diálogo nativo.
rfd = "0.17"
# Espera o seletor nativo fora da thread de UI (já no grafo via wgpu).
pollster = "1.0"

[dev-dependencies]
localkeys-core = { path = "crates/core", features = ["test-support"] }
# Testes de UI sem janela (egui_kittest): a barra, as Configurações e a paleta respondem a cliques e teclas.
egui_kittest = { version = "0.37", default-features = false, features = ["wgpu"] }

[target.'cfg(windows)'.dependencies]
# Desbloqueio rápido (chave no Credential Manager) — só no Windows: o
# secret-service do Linux puxaria libdbus pro build/AppImage (runner nem tem
# dbus-1 dev). Mesma política do tray. (O rfd agora é global com portal XDG
# — src/pickers.rs.)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Flag ExcludeClipboardContentFromMonitorProcessing ao copiar senha
clipboard-win = "5.4"
# Bandeja só no Windows (mesma política do lab-clip: no Linux o tray-icon
# puxaria muda→gtk3 e engordaria o AppImage).
tray-icon = "0.24"
# Controle da janela fora do ciclo de pintura — janela oculta não recebe
# WM_PAINT no Windows, o eframe congela; a thread da bandeja acorda a
# janela com ShowWindow direto (ver winctl.rs).
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
