name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --bin local-keys
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Create NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          makensis packaging/windows/installer.nsi
          if (Test-Path "local-keys-setup.exe") {
            Move-Item "local-keys-setup.exe" "out/local-keys-setup.exe"
          }
          Get-ChildItem out | Select-Object Name, Length
      - name: Portable zip
        shell: pwsh
        run: |
          if (-not (Test-Path out)) { New-Item -ItemType Directory -Force -Path out | Out-Null }
          Compress-Archive -Path "target/release/local-keys.exe" -DestinationPath "out/local-keys-windows-x64.zip" -Force
          Get-ChildItem out | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev
      - name: Build release
        run: cargo build --release --bin local-keys
      - name: Package
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          mkdir -p out
          appdir="AppDir-local-keys"
          mkdir -p "$appdir/usr/bin"
          cp "target/release/local-keys" "$appdir/usr/bin/"
          cp "icons/icon.png" "$appdir/local-keys.png"
          printf '[Desktop Entry]\nType=Application\nName=LocalKeys\nExec=local-keys\nIcon=local-keys\nCategories=Utility;Security;\nComment=Gerenciador de senhas 100%% local e offline\nTerminal=false\nStartupWMClass=local-keys\n' > "$appdir/local-keys.desktop"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir "$appdir" \
            --desktop-file "$appdir/local-keys.desktop" \
            --icon-file "$appdir/local-keys.png" --output appimage
          ls -la *.AppImage 2>/dev/null || true
          if ls LocalKeys*.AppImage 1>/dev/null 2>&1; then
            mv LocalKeys*.AppImage "out/local-keys-x86_64.AppImage"
          fi
          tar -czf "out/local-keys-linux-x86_64.tar.gz" -C "target/release" local-keys
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Valida PKGBUILD
        run: |
          version=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*= "\([^"]*\)".*/\1/')
          cat > PKGBUILD <<EOF
          pkgname=local-keys
          pkgver=$version
          pkgrel=1
          pkgdesc='Gerenciador de senhas 100% local e offline'
          arch=(x86_64)
          url='https://github.com/Anon5T4R/Local-Keys'
          license=(GPL-3.0-or-later)
          depends=(glibc gcc-libs libxcb libxrandr libxi libxcursor libxkbcommon)
          makedepends=(rust cargo)
          source=("local-keys-$pkgver.tar.gz::https://github.com/Anon5T4R/Local-Keys/archive/refs/tags/v$pkgver.tar.gz")
          sha256sums=(SKIP)
          build() {
            cd "local-keys-$pkgver"
            cargo build --release --bin local-keys
          }
          package() {
            cd "local-keys-$pkgver"
            install -Dm755 "target/release/local-keys" "$pkgdir/usr/bin/local-keys"
            install -Dm644 "icons/icon.png" "$pkgdir/usr/share/icons/hicolor/256x256/apps/local-keys.png"
            install -Dm644 "packaging/linux/local-keys.desktop" "$pkgdir/usr/share/applications/local-keys.desktop"
          }
          EOF
          namcap PKGBUILD || true
          echo "PKGBUILD gerado e validado"

  publish:
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LocalKeys ${GITHUB_REF_NAME}" \
            --notes "Gerenciador de senhas 100% local e offline." \
            dist/windows/* dist/linux/*
