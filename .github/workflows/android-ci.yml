name: Android CI

on:
  push:
    # Só a main: push de tag (v*) não dispara o CI — o release.yml já cuida do
    # release. Antes, toda tag rodava o CI de novo (duplicava o job).
    branches: ["main"]
    paths: ["android/**", "crates/core/**", "crates/ffi/**", "src/main.rs", "i18n/**", ".github/workflows/android-*.yml", ".github/actions/android-native/**"]
  pull_request:
    paths: ["android/**", "crates/core/**", "crates/ffi/**", "src/main.rs", "i18n/**", ".github/workflows/android-*.yml", ".github/actions/android-native/**"]
  workflow_dispatch:

# O app Android mora em android/ (o núcleo Rust que ele vai usar, em crates/core).
defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Rust + cargo-ndk: o Gradle compila o núcleo (crates/ffi) para cada ABI antes do APK.
      - uses: ./.github/actions/android-native

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Os testes primeiro: se a cripto/TOTP/model quebrou, não interessa se o APK sai.
      # Os testes JVM validam o port contra o fixture .tkeys gerado no desktop.
      - name: Testes unitários
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Smoke real: abre o app num emulador Android e confirma que a UI sobe.
  # O ci.yml antigo não pegava crash de startup (ex.: o Application inexistente
  # no manifest que matou a v0.1.0) — só compilar/rodar o app expõe isso.
  # Ele falhava em toda execução, e o `continue-on-error` escondia: o diálogo de permissão de
  # notificação cobria o app. O teste concede a permissão (GrantPermissionRule) e o job voltou a
  # valer como portão.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Rust + cargo-ndk: o Gradle compila o núcleo (crates/ffi) para cada ABI antes do APK.
      - uses: ./.github/actions/android-native

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Os runners Linux do GitHub têm /dev/kvm; sem a permissão o emulador
      # sobe sem aceleração e estoura o timeout de boot (flake histórico).
      - name: Habilitar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test (emulador Android)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          working-directory: android
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --console=plain
