[package]
name = "localkeys-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish.workspace = true
description = "Núcleo do Local Keys: formato .tkeys, cofre, importadores, TOTP e gerador (sem UI)"

[features]
# `crypto::test_session`: sessão com Argon2 mínimo, para os testes de quem usa a crate.
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cripto — MESMOS pins do LocalKeys oficial (crypto.rs/totp.rs copiados verbatim)
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
totp-rs = { version = "5", default-features = false }
# Anexos (vault.rs) e o import do export cifrado do Bitwarden (bwdecrypt.rs).
base64 = "0.22"
# Import de cofres KeePass (.kdbx) — lê/decifra com a senha do usuário.
keepass = "0.7"
# Gerador de senha/passphrase + medidor de força (zxcvbn).
zxcvbn = "3"
# Import do export CIFRADO do Bitwarden (PBKDF2/Argon2id → HKDF → AES-CBC+HMAC).
pbkdf2 = "0.12"
hkdf = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
